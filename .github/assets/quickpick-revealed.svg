<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <rect width="600" height="480" fill="#1e1e1e"/>
  <rect x="0" y="0" width="600" height="36" fill="#323233"/>
  <text x="16" y="23" fill="#cccccc" font-size="13" font-weight="500">Agent Quickpick — Command Palette</text>

  <rect x="80" y="60" width="440" height="400" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="80" y="60" width="440" height="34" rx="6" fill="#3c3c3c"/>
  <text x="96" y="82" fill="#cccccc" font-size="13">Open agent terminal</text>

  <!-- Eye toggle (active state) -->
  <g transform="translate(486, 70)">
    <rect x="0" y="0" width="24" height="14" rx="3" fill="#0e639c" stroke="#5a5a5a" stroke-width="1"/>
    <text x="12" y="12" text-anchor="middle" fill="#ffffff" font-size="11">👁</text>
  </g>

  <g font-size="13" fill="#cccccc">
    <!-- Installed group -->
    <rect x="80" y="100" width="440" height="26" fill="#094771" opacity="0.4"/>
    <circle cx="100" cy="113" r="6" fill="#64748B"/>
    <text x="116" y="118">Terminal</text>
    <text x="420" y="118" fill="#858585" font-size="12">shell</text>

    <rect x="80" y="126" width="440" height="26" fill="transparent"/>
    <rect x="94" y="132" width="14" height="14" rx="3" fill="#FF8C00"/>
    <text x="116" y="144">Claude</text>
    <text x="420" y="144" fill="#858585" font-size="12">claude</text>

    <rect x="80" y="152" width="440" height="26" fill="transparent"/>
    <rect x="94" y="158" width="14" height="14" rx="3" fill="#3B82F6"/>
    <text x="116" y="170">OpenCode</text>
    <text x="420" y="170" fill="#858585" font-size="12">opencode</text>

    <!-- Separator -->
    <line x1="80" y1="186" x2="520" y2="186" stroke="#3c3c3c" stroke-width="1"/>
    <text x="96" y="204" fill="#858585" font-size="11" font-weight="600" letter-spacing="0.5">NOT INSTALLED</text>
    <line x1="80" y1="212" x2="520" y2="212" stroke="#3c3c3c" stroke-width="1"/>

    <!-- Uninstalled group (dimmed) -->
    <g opacity="0.6">
      <rect x="80" y="214" width="440" height="26" fill="transparent"/>
      <rect x="94" y="220" width="14" height="14" rx="3" fill="#10A37F"/>
      <text x="116" y="232">Codex</text>
      <text x="420" y="232" fill="#858585" font-size="12">codex</text>

      <rect x="80" y="240" width="440" height="26" fill="transparent"/>
      <rect x="94" y="246" width="14" height="14" rx="3" fill="#1C7CDD"/>
      <text x="116" y="258">Gemini</text>
      <text x="420" y="258" fill="#858585" font-size="12">gemini</text>

      <rect x="80" y="266" width="440" height="26" fill="transparent"/>
      <rect x="94" y="272" width="14" height="14" rx="3" fill="#DC2626"/>
      <text x="116" y="284">Aider</text>
      <text x="420" y="284" fill="#858585" font-size="12">aider</text>

      <text x="300" y="320" text-anchor="middle" fill="#5a5a5a" font-size="11" font-style="italic">… 15 more hidden agents revealed …</text>
    </g>
  </g>
</svg>
